<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="820" height="470" viewBox="0 0 820 470">
  <title>Folders dialog</title>
  <g id="window">
    <image x="0" y="0" width="820" height="470"
           xlink:href="data:image/png;base64,"/>
  </g>
  <g id="anchors" fill="none" stroke="#4DA3FF" stroke-width="1"
     stroke-dasharray="5 4" opacity="0.85">
    <g id="CloseBtn">
      <title>CloseBtn  (IconButton)</title>
      <rect x="755" y="24" width="35" height="35" rx="3"/>
    </g>
    <g id="list">
      <title>list  (RowListView)</title>
      <rect x="6" y="56" width="808" height="279" rx="3"/>
    </g>
    <g id="remove">
      <title>remove  (GlassButton)</title>
      <rect x="30" y="405" width="99" height="35" rx="3"/>
    </g>
    <g id="ok">
      <title>ok  (GlassButton)</title>
      <rect x="707" y="405" width="83" height="35" rx="3"/>
    </g>
    <g id="cancel">
      <title>cancel  (GlassButton)</title>
      <rect x="609" y="405" width="88" height="35" rx="3"/>
    </g>
  </g>
</svg>
